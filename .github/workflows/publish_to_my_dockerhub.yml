name: Build & Push my Chatwoot CE

on:
  push:
    branches:
      - develop
      - main
      - stable-4.7
    # اختياري: فعّل السطور التالية لو عايز يبني فقط عند تغيّر ملفات معيّنة
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - 'package.json'
      - 'yarn.lock'
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'lib/**'
      - 'bin/**'
  workflow_dispatch:

env:
  DOCKER_REPO: coidsa/chatwoot

# يلغِي أي Run قديم لنفس الفرع لو عملت push جديد
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # 🚀 Build مع كاش GHA + أكثر من tag (latest و v4.7.0 و sha)
      - name: Build & Push (amd64) with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:latest
            ${{ env.DOCKER_REPO }}:v4.7.0
            ${{ env.DOCKER_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


          - name: Replace Chatwoot domain
  run: |
    grep -rl "https://www.chatwoot.com" ./ | xargs sed -i 's|https://www.chatwoot.com|https://c.hupa.app|g'
